<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planes de Suscripcion</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row g-4">
        <div class="col-12 col-md-4">
        <div class="card h-100 bg-light text-center">
        <div class="card-body d-flex flex-column">
    <h5 class="fw-bold">Plan Estudiante</h5>
        <p class="display-4 fw-bold">$9.99<small class="fs-6 fw-normal">/mes</small></p>
    <button class="btn btn-outline-primary w-100 mt-auto">Elegir Plan</button>
        </div>
        </div>
    </div>
      <div class="col-12 col-md-4">
        <div class="card h-100 bg-primary text-white text-center">
          <div class="card-body d-flex flex-column">
            <div><span class="badge bg-warning text-dark mb-2">Mas Popular</span></div>
            <h5 class="fw-bold">Plan Pro VIP</h5>
            <p class="display-4 fw-bold">$24.99<small class="fs-6 fw-normal">/mes</small></p>
            <button class="btn btn-warning w-100 mt-auto">Elegir Plan</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card h-100 bg-dark text-white text-center">
          <div class="card-body d-flex flex-column">
            <h5 class="fw-bold">Plan Institucional</h5>
            <p class="display-4 fw-bold">$79.99<small class="fs-6 fw-normal">/mes</small></p>
            <button class="btn btn-warning w-100 mt-auto">Elegir Plan</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
